version: 2

sources:
  - name: starter_demo
    description: >
      Demo-only source contract over the starter model supplied with this project.
      Replace this relation with an ELT-managed raw table before using the pipeline
      for production data.
    schema: "{{ target.schema }}"
    tables:
      - name: starter_ids
        identifier: my_first_dbt_model
        description: >
          One row per starter ID emitted by the project template. The source includes
          a null record to demonstrate the silver-layer data-quality filter.
        columns:
          - name: id
            description: Identifier supplied by the demo source; null values are retained in bronze.
            data_tests:
              - unique
